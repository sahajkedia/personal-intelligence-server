<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Personal Intelligence</title>

		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				max-width: 800px;
				margin: 60px auto;
				padding: 20px;
			}

			textarea,
			input {
				width: 100%;
				box-sizing: border-box;
				padding: 14px;
				margin: 10px 0;
				font-size: 16px;
			}

			textarea {
				height: 140px;
			}

			button {
				padding: 12px 20px;
				font-size: 15px;
				cursor: pointer;
			}

			.section {
				margin-top: 50px;
			}

			.note {
				padding: 15px 0;
				border-bottom: 1px solid #ddd;
			}

			#status {
				margin-top: 10px;
			}
		</style>
	</head>

	<body>
		<h1>Personal Intelligence</h1>

		<div class="section">
			<h2>What's on your mind?</h2>

			<input
				id="title"
				placeholder="Title (optional)" />

			<textarea
				id="content"
				placeholder="Write anything..."></textarea>

			<button onclick="saveNote()">Save</button>

			<div id="status"></div>
		</div>

		<div class="section">
			<h2>Search your thoughts</h2>

			<input
				id="search"
				placeholder="Search..."
				oninput="searchNotes()" />

			<div id="results"></div>
		</div>

		<script>
			async function saveNote() {
				const title = document.getElementById("title").value;

				const content = document.getElementById("content").value;

				if (!content.trim()) {
					alert("Write something first.");
					return;
				}

				const response = await fetch("/notes", {
					method: "POST",

					headers: {
						"Content-Type": "application/json",
					},

					body: JSON.stringify({
						title: title || null,
						content: content,
					}),
				});

				if (response.ok) {
					document.getElementById("content").value = "";
					document.getElementById("title").value = "";

					document.getElementById("status").innerText = "Saved ✓";

					setTimeout(() => {
						document.getElementById("status").innerText = "";
					}, 2000);
				} else {
					document.getElementById("status").innerText = "Something went wrong.";
				}
			}

			async function searchNotes() {
				const query = document.getElementById("search").value;

				const results = document.getElementById("results");

				if (!query.trim()) {
					results.innerHTML = "";
					return;
				}

				const response = await fetch(
					`/notes/search?q=${encodeURIComponent(query)}`,
				);

				const data = await response.json();

				results.innerHTML = data.results
					.map(
						(note) => `

          <div class="note">
            <strong>${note.title || "Untitled"}</strong>
            <p>${note.content}</p>
          </div>

        `,
					)
					.join("");
			}
		</script>
	</body>
</html>
